<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonus Claim</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f4f7fb, #e7eef8);
      color: #222;
    }
    .card {
      width: min(92%, 420px);
      background: #fff;
      border-radius: 18px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,0,0,.12);
    }
    .icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #eaf8ee;
      color: #21a453;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0 0 25px; color: #666; line-height: 1.5; }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      background: #1877f2;
      color: white;
    }
    button:hover { opacity: .92; }
    #loading {
      display: none;
      margin-top: 15px;
      color: #666;
      font-size: 14px;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ddd;
      border-top-color: #1877f2;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      vertical-align: middle;
      margin-right: 7px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">✓</div>
    <h1>Congratulations!</h1>
    <p>Your bonus is ready to be claimed. Click the button below to continue.</p>

    <button id="continueBtn" onclick="continueToClaim()">Continue</button>

    <div id="loading">
      <span class="spinner"></span> Please wait...
    </div>
  </div>

  <script>
    // APNA URL YAHAN PASTE KAREIN:
    const redirectURL = "https://get-bonus-here-today.vercel.app/";

    function continueToClaim() {
      const button = document.getElementById("continueBtn");
      const loading = document.getElementById("loading");

      button.style.display = "none";
      loading.style.display = "block";

      setTimeout(() => {
        window.location.href = redirectURL;
      }, 1200);
    }
  </script>

</body>
</html>
